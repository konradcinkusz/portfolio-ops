name: CodeQL

# ─────────────────────────────────────────────────────────────────────────────
#  Static analysis (REPO-BASELINE.md §1): it runs because a workflow runs it, not
#  because someone remembers to.
#
#  Two languages. Python is the engine. "actions" is the composite action and these
#  workflows: action.yml runs in other people's repositories, on their private data,
#  with a token that can write issues — script injection there would be the most
#  damaging bug this repository could ship.
#
#  No build step: neither language needs one. This repository is public, so code
#  scanning needs no Advanced Security licence.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 04:00 UTC: query packs change under code that has not.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # to upload the results
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The engine is small enough that the quality queries are affordable, and a
          # correctness bug in a gate is as damaging as a security one.
          queries: security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
