# portfolio-ops as a composite action (business rules §3, §7.6, §8.7).
#
# The action installs the engine from its own checkout, so the version a caller pins is
# the version that runs — there is no second version reference to keep in sync (ADR 0002).
# Every input reaches the shell through `env`, never through `${{ }}` inside a script, so
# no input can inject shell code.
name: portfolio-ops
description: Validate a private portfolio data repository, keep one weekly-review issue current, render its dashboard and overview, and check the account's work against it.
author: Konrad Cinkusz
branding:
  icon: check-square
  color: gray-dark

inputs:
  command:
    description: "validate, report, dashboard or overview."
    required: true
  path:
    description: The directory holding the data files, relative to the workspace.
    required: false
    default: "."
  publish:
    description: 'With command: report — "true" keeps one open weekly-review issue current.'
    required: false
    default: "false"
  dry-run:
    description: 'With publish — "true" prints the planned action and the issue body and sends no write request.'
    required: false
    default: "false"
  github-token:
    description: Token for the visibility check (rule S7) and for publishing. The workflow's own token is enough.
    required: false
    default: ${{ github.token }}
  account-token:
    description: >-
      Optional — with command: report, dashboard or overview, scans the account (rules
      A1–A3). A fine-grained, read-only token of the account's owner; pass the secret
      PORTFOLIO_ACCOUNT_TOKEN. Empty: the account is not scanned.
    required: false
  python-version:
    description: The Python that runs the engine.
    required: false
    default: "3.13"

outputs:
  dashboard:
    description: >-
      With command: dashboard — the path of the HTML page, for actions/upload-artifact. The
      page lists the portfolio's weak spots: keep it a workflow artifact, never publish it
      on GitHub Pages.
    value: ${{ steps.run.outputs.dashboard }}
  overview:
    description: >-
      With command: overview — the directory of the overview's Markdown pages, for
      actions/upload-artifact and a job that commits them to the private data repository.
      Never publish them on GitHub Pages.
    value: ${{ steps.run.outputs.overview }}

runs:
  using: composite
  steps:
    - name: Set up Python for portfolio-ops
      id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        # Leave the caller's PATH alone: the engine runs from its own virtual environment.
        update-environment: false

    - name: Install portfolio-ops from this action's checkout
      id: install
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        set -euo pipefail
        venv="$RUNNER_TEMP/portfolio-ops"
        "$PYTHON" -m venv "$venv"
        if [ -x "$venv/bin/python" ]; then engine="$venv/bin/python"; else engine="$venv/Scripts/python.exe"; fi
        "$engine" -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"
        echo "python=$engine" >> "$GITHUB_OUTPUT"

    - name: Fetch the full history the clock and P1 need
      shell: bash
      env:
        DATA_PATH: ${{ inputs.path }}
      run: |
        # report reads the clock and the week's status changes from git history (rules N1
        # and P1), the dashboard and the overview show the clock, and validate compares with
        # the previous commit (P1). On a shallow checkout report would stop with exit 2, the
        # dashboard and the overview would show no clocks and validate would skip P1, so
        # unshallow it here; if that fails, the engine's own message names fetch-depth: 0.
        if [ "$(git -C "$DATA_PATH" rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
          git -C "$DATA_PATH" fetch --unshallow --quiet \
            || echo "::warning title=portfolio-ops::could not fetch the full history; set fetch-depth: 0 on actions/checkout"
        fi

    - name: Run portfolio-ops
      id: run
      shell: bash
      env:
        ENGINE: ${{ steps.install.outputs.python }}
        COMMAND: ${{ inputs.command }}
        DATA_PATH: ${{ inputs.path }}
        PUBLISH: ${{ inputs.publish }}
        DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # Only report, dashboard and overview scan the account, so only they receive its token.
        PORTFOLIO_ACCOUNT_TOKEN: ${{ inputs.command != 'validate' && inputs.account-token || '' }}
        ACCOUNT_TOKEN_GIVEN: ${{ inputs.account-token != '' }}
      run: |
        set -euo pipefail
        args=("$COMMAND" --path "$DATA_PATH")
        case "$COMMAND" in
          validate | dashboard | overview) ;;
          report)
            if [ "$PUBLISH" = "true" ]; then args+=(--publish); fi
            if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
            ;;
          *)
            echo "::error title=portfolio-ops::the command input must be validate, report, dashboard or overview"
            exit 2
            ;;
        esac
        if [ "$COMMAND" != report ] && { [ "$PUBLISH" = "true" ] || [ "$DRY_RUN" = "true" ]; }; then
          echo "::warning title=portfolio-ops::publish and dry-run apply to the report command only"
        fi
        if [ "$COMMAND" = validate ] && [ "$ACCOUNT_TOKEN_GIVEN" = "true" ]; then
          echo "::warning title=portfolio-ops::account-token applies to report, dashboard and overview only; validate never scans the account"
        fi
        # The dashboard and the overview go outside the workspace, so neither can be
        # committed by accident: the overview reaches the repository only through the job
        # that commits it.
        page="$RUNNER_TEMP/portfolio-dashboard.html"
        pages="$RUNNER_TEMP/portfolio-overview"
        if [ "$COMMAND" = dashboard ]; then args+=(--output "$page"); fi
        if [ "$COMMAND" = overview ]; then rm -rf "$pages"; args+=(--output "$pages"); fi
        "$ENGINE" -m portfolio_ops "${args[@]}"
        if [ "$COMMAND" = dashboard ]; then echo "dashboard=$page" >> "$GITHUB_OUTPUT"; fi
        if [ "$COMMAND" = overview ]; then echo "overview=$pages" >> "$GITHUB_OUTPUT"; fi
