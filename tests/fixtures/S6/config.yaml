# Fictional test data. It lives in a public repository, so it opts in to being public;
# a real data repository stays private instead (business rules §8.8).
# S6 fixture: a schema_version this engine does not read.
schema_version: 2
allow_public: true

thresholds:
  stale_days: 30
  actions_per_week: 1
  wip_limit: 4

vocabularies:
  contexts: [website, store]
  capabilities: [sync, maps, notes]
  finding_types: [name_check]
  decision_types: [external]

finding_ttl_days:
  name_check: 90
